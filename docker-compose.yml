services:
  freelancehunt-bot:
    build: .
    container_name: freelancehunt-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app
    deploy:
      resources:
        reservations:
          memory: 30M
    networks:
      - bots-net

networks:
  bots-net:
    external: true
